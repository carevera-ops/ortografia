# Compila, pasa los tests y publica en GitHub Pages con cada push a main.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # El build incluye: comprobación de tipos + tests unitarios + validación del banco + vite build
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Si la instalación se atasca (pasa a veces en los servidores de GitHub), se reintenta.
      - name: Instalar WebKit
        timeout-minutes: 6
        run: npx playwright install --with-deps webkit || (sleep 10 && npx playwright install --with-deps webkit)
      - run: npm run build
        env:
          BASE_PATH: /ortografia/
      # Pruebas de extremo a extremo con WebKit (el motor de Safari) emulando un iPhone
      - run: npm run test:e2e
        env:
          PW_BROWSER: webkit
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
